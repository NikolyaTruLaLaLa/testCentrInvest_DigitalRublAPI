name: .NET Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Cache NuGet packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: Restore dependencies
      run: |
        dotnet restore DigitalRubleWallet.slnx
        # Явно восстанавливаем проекты, которые могут быть не включены в решение
        dotnet restore WebAPI/WebAPI.csproj
        dotnet restore WebAPI.IntegrationTests/WebAPI.IntegrationTests.csproj

    - name: Build
      run: dotnet build DigitalRubleWallet.slnx --no-restore --configuration Release

    - name: Test
      run: dotnet test DigitalRubleWallet.slnx --no-build --configuration Release --logger "trx;LogFileName=test-results.trx" --results-directory TestResults
      env:
        TESTCONTAINERS_RYUK_DISABLED: true

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results
        path: TestResults